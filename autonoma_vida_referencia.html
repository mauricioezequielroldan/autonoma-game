<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== 1. CONFIG ===========================================================
const CONFIG = {
  seed: 20261019,
  firePos:    new THREE.Vector2(2.5, 1.5),
  shelterPos: new THREE.Vector2(-4.2, -2.6),
  pilePos:    new THREE.Vector2(4.4, 3.2),
  sunDir:     new THREE.Vector3(0.28, 0.12, -1).normalize(), // sol bajo = sombras largas
  walkSpeed: 1.45, carrySpeed: 1.1,
  fuelDecay: 0.010,         // por segundo
  dayLengthSec: 1200,       // 20 min reales = 1 día
  counts: { pine: 260, broad: 150, old: 35, grass: 12000, flowers: 900, bushes: 230, rocks: 150 },
  debug: false,
};

// ===== 2. RUIDO / TERRENO ===================================================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(CONFIG.seed);
const rr = (a,b)=>a+(b-a)*rand();
const hash2 = (x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453123;return s-Math.floor(s);};
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;}
function fbm(x,y,o=4){let v=0,a=.5,f=1;for(let i=0;i<o;i++){v+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return v;}
const smooth=(e0,e1,x)=>{const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);};
const wrap=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};

// ===== 3. ARROYO (cauce) ====================================================
const streamCurve = new THREE.CatmullRomCurve3(
  [[-160,-70],[-95,-42],[-40,-31],[8,-27],[48,-36],[95,-22],[160,-48]].map(([x,z])=>new THREE.Vector3(x,0,z)));
const streamPts = streamCurve.getSpacedPoints(420).map(p=>new THREE.Vector2(p.x,p.z));
function streamInfo(x,z){let m=1e18,bi=0;for(let i=0;i<streamPts.length;i++){const p=streamPts[i];const dx=p.x-x,dz=p.y-z;const d=dx*dx+dz*dz;if(d<m){m=d;bi=i;}}return {d:Math.sqrt(m),i:bi};}

function rawH(x,z){
  let h=(fbm(x*.012+3.1,z*.012-1.7)-.5)*16+(fbm(x*.05+7,z*.05+2)-.5)*2.2;
  const e=Math.max(Math.abs(x),Math.abs(z));
  h+=smooth(95,150,e)*28*(.6+.8*fbm(x*.02,z*.02));
  return h;
}
const CAMP_H = rawH(0,0);
function landH(x,z){const dc=Math.hypot(x,z);return CAMP_H+(rawH(x,z)-CAMP_H)*smooth(9,22,dc);}
const streamBase = streamPts.map(p=>landH(p.x,p.y));
for(let k=0;k<6;k++) for(let i=1;i<streamBase.length-1;i++) streamBase[i]=(streamBase[i-1]+2*streamBase[i]+streamBase[i+1])/4;

/** ÚNICA fuente de altura. Todo (personaje, objetos, cámara) se apoya acá. */
function heightAt(x,z){
  const s=streamInfo(x,z); let h=landH(x,z); const cb=streamBase[s.i];
  h=cb+(h-cb)*smooth(3.5,13,s.d);
  h-=(1-smooth(2.0,6.5,s.d))*2.3;
  return h;
}
const waterY = i => streamBase[i]-1.2;
const isWalkable = (x,z)=> streamInfo(x,z).d>6 && Math.max(Math.abs(x),Math.abs(z))<92;

// ===== RENDERER / ESCENA =====================================================
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.info.autoReset=false;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xc4826a,55,340);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,2200);

// ===== 4. CIELO ==============================================================
const skyUniforms={uSunDir:{value:CONFIG.sunDir.clone()},uTime:{value:0}};
const skyMat=new THREE.ShaderMaterial({
  uniforms:skyUniforms, side:THREE.BackSide, depthWrite:false,
  vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 uSunDir; uniform float uTime; varying vec3 vDir;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
    void main(){
      vec3 d=normalize(vDir); float y=d.y;
      vec3 hor=vec3(1.0,.42,.14), mid=vec3(.52,.18,.14), top=vec3(.05,.07,.19);
      vec3 col=mix(hor,mid,smoothstep(0.0,.2,y)); col=mix(col,top,smoothstep(.15,.7,y));
      col=mix(col,vec3(.32,.15,.12),smoothstep(0.0,-.25,y));
      float s=max(dot(d,normalize(uSunDir)),0.0);
      col+=vec3(1.,.5,.18)*pow(s,6.)*.55+vec3(1.,.68,.32)*pow(s,60.)*1.1;
      col+=vec3(1.,.9,.7)*smoothstep(.9994,.9997,s)*14.;
      if(y>0.0){
        vec2 uv=d.xz/(y+.12)*1.15+vec2(uTime*.004,0.);
        float c=smoothstep(.48,.78,fbm(uv*1.4));
        vec3 cc=mix(vec3(.85,.36,.26),vec3(1.,.72,.42),pow(s,3.));
        cc=mix(cc,vec3(.22,.15,.26),smoothstep(.15,.6,y));
        col=mix(col,cc,c*.85*smoothstep(0.0,.1,y));
      }
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),skyMat); sky.frustumCulled=false; scene.add(sky);
// Mapa de entorno a partir del cielo (reflejos del agua)
const pmrem=new THREE.PMREMGenerator(renderer);
const skyScene=new THREE.Scene(); skyScene.add(new THREE.Mesh(sky.geometry,skyMat));
const envTex=pmrem.fromScene(skyScene,0,.1,2000).texture;

// Luces
const sun=new THREE.DirectionalLight(0xffa766,2.7);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:320});
sun.shadow.bias=-.0004; sun.shadow.normalBias=.05;
scene.add(sun,sun.target);
scene.add(new THREE.HemisphereLight(0xffc49a,0x2e2236,.6));

// Texturas procedurales
function canvasTex(size,fn,srgb=true){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const im=g.createImageData(size,size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const [r,gg,b,a]=fn(x,y);const i=(y*size+x)*4;im.data[i]=r;im.data[i+1]=gg;im.data[i+2]=b;im.data[i+3]=a??255;}
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const detailTex=canvasTex(256,()=>{const v=205+Math.random()*50;return[v,v,v];});
detailTex.repeat.set(140,140);
const waterNormal=canvasTex(128,(x,y)=>{const S=128,T=Math.PI*2/S;
  const dx=Math.cos(T*(3*x+y))*.6+Math.cos(T*(5*x-2*y)+1.3)*.4+Math.cos(T*(9*x+4*y)+.7)*.25;
  const dy=Math.cos(T*(x+4*y)+.4)*.6+Math.cos(T*(-2*x+6*y)+2.1)*.4+Math.cos(T*(4*x+9*y)+1.9)*.25;
  const nx=-dx*.35,ny=-dy*.35,l=Math.hypot(nx,ny,1);return[(nx/l*.5+.5)*255,(ny/l*.5+.5)*255,(1/l*.5+.5)*255];},false);
const smokeTex=canvasTex(64,(x,y)=>{const d=Math.hypot(x-32,y-32)/32;const a=Math.max(0,1-d);return[200,190,185,a*a*255];});

// ===== TERRENO ==============================================================
const C=h=>new THREE.Color(h);
const COL={grass:C(0x4c5a2a),dry:C(0x7f6c3a),dirt:C(0x5c4130),mud:C(0x3b2c22),rock:C(0x6c645c),moss:C(0x3e4c22),litter:C(0x70482a)};
const terrainGeo=new THREE.PlaneGeometry(300,300,220,220); terrainGeo.rotateX(-Math.PI/2);
{
  const p=terrainGeo.attributes.position, cols=new Float32Array(p.count*3), c=new THREE.Color();
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,heightAt(x,z));}
  terrainGeo.computeVertexNormals();
  const nrm=terrainGeo.attributes.normal;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),y=p.getY(i);
    c.copy(COL.grass);
    c.lerp(COL.moss,smooth(.45,.7,fbm(x*.06+11,z*.06)));
    c.lerp(COL.dry,smooth(.52,.72,fbm(x*.04-5,z*.04+9))*.8);
    c.lerp(COL.litter,smooth(.55,.75,fbm(x*.11+2,z*.11-3))*.6);
    const dc=Math.hypot(x-CONFIG.firePos.x,z-CONFIG.firePos.y);
    c.lerp(COL.dirt,(1-smooth(3,8,dc+fbm(x*.4,z*.4)*3)));
    // sendero campamento -> arroyo
    const t=Math.max(0,Math.min(1,((x-2)*6+(z-1)*(-27))/(6*6+27*27)));
    const pd=Math.hypot(x-(2+6*t),z-(1-27*t))+ (fbm(x*.3,z*.3)-.5)*1.6;
    c.lerp(COL.dirt,(1-smooth(.6,1.6,pd))*.85);
    const sd=streamInfo(x,z).d; c.lerp(COL.mud,1-smooth(3,7.5,sd));
    if(sd<3.2) c.lerp(COL.rock,.5);
    c.lerp(COL.rock,smooth(.86,.7,nrm.getY(i))*.9 + smooth(10,22,y-CAMP_H)*.5);
    const v=.88+fbm(x*.9,z*.9)*.24; c.multiplyScalar(v);
    cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  }
  terrainGeo.setAttribute('color',new THREE.BufferAttribute(cols,3));
}
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({vertexColors:true,map:detailTex,roughness:.96}));
terrain.receiveShadow=true; scene.add(terrain);
const underDisc=new THREE.Mesh(new THREE.CircleGeometry(900,32),new THREE.MeshStandardMaterial({color:0x2a2028,roughness:1}));
underDisc.rotation.x=-Math.PI/2; underDisc.position.y=CAMP_H-8; scene.add(underDisc);

// ===== AGUA =================================================================
{
  const N=streamPts.length, W=4.6, pos=[], uv=[], idx=[];
  for(let i=0;i<N;i++){
    const a=streamPts[Math.max(0,i-1)], b=streamPts[Math.min(N-1,i+1)];
    const tx=b.x-a.x,tz=b.y-a.y,l=Math.hypot(tx,tz)||1, nx=-tz/l, nz=tx/l, p=streamPts[i], y=waterY(i);
    pos.push(p.x+nx*W,y,p.y+nz*W, p.x-nx*W,y,p.y-nz*W); uv.push(0,i*.09, 1,i*.09);
    if(i<N-1){const k=i*2; idx.push(k,k+2,k+1, k+1,k+2,k+3);}
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx); g.computeVertexNormals();
  var water=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x2b4a55,roughness:.1,metalness:0,envMap:envTex,envMapIntensity:1.3,
    normalMap:waterNormal,normalScale:new THREE.Vector2(.5,.5),transparent:true,opacity:.86}));
  water.receiveShadow=true; scene.add(water);
}

// ===== MONTAÑAS =============================================================
function jitter(geo,amt,seed=0){const p=geo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const n=(hash2(x*3.1+seed,z*2.7+y*1.3)-.5)*amt, m=(hash2(z*1.7-seed,x*2.3+y)-.5)*amt;p.setXYZ(i,x+n,y+(n+m)*.3,z+m);}geo.computeVertexNormals();return geo;}
{
  const mat=new THREE.MeshStandardMaterial({color:0x4c3a52,roughness:1,flatShading:true});
  for(let i=0;i<54;i++){
    const a=i/54*Math.PI*2+rr(-.05,.05), R=rr(205,290);
    const facing=Math.max(0,-Math.sin(a+Math.PI/2)); // más altas hacia el sol
    const h=rr(45,95)+facing*55, g=jitter(new THREE.ConeGeometry(rr(38,70),h,8,5),9,i);
    const m=new THREE.Mesh(g,mat); m.position.set(Math.cos(a)*R,CAMP_H-12+h/2,Math.sin(a)*R); m.rotation.y=rr(0,6); scene.add(m);
  }
}

// ===== 5. VEGETACIÓN ========================================================
const windU={value:0};
function addWind(mat,amp){mat.onBeforeCompile=s=>{s.uniforms.uTime=windU;
  s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
    float ph=instanceMatrix[3].x*.13+instanceMatrix[3].z*.17;
    float sw=(sin(uTime*1.4+ph)+.4*sin(uTime*3.1+ph*2.))*${amp.toFixed(3)}*max(position.y,0.);
    transformed.x+=sw; transformed.z+=sw*.6;`);};return mat;}
const ni=g=>g.index?g.toNonIndexed():g;

function pineGeos(){const parts=[];for(let k=0;k<5;k++){const r=2.1-k*.38,g=new THREE.ConeGeometry(r,2.3,9,2);g.translate(0,2.4+k*1.15,0);parts.push(ni(jitter(g,.35,k)));}
  const trunk=new THREE.CylinderGeometry(.16,.32,4.8,7);trunk.translate(0,2.4,0);return[ni(trunk),mergeGeometries(parts)];}
function broadGeos(){const parts=[];const centers=[[0,5.2,0],[1.2,4.7,.4],[-1.1,4.6,-.3],[.3,4.5,-1.2],[-.4,5.9,.6],[.6,6.1,-.4]];
  centers.forEach(([x,y,z],k)=>{const g=new THREE.IcosahedronGeometry(rr(1.2,1.7),1);g.translate(x,y,z);parts.push(ni(jitter(g,.45,k+10)));});
  const t=new THREE.CylinderGeometry(.2,.36,4.6,8,4);const p=t.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i)+2.3;p.setX(i,p.getX(i)+y*y*.02);}
  t.translate(0,2.3,0);t.computeVertexNormals();return[ni(t),mergeGeometries(parts)];}
function oldGeos(){const parts=[];[[1.4,6.4,.2],[-1.2,5.6,.5],[2.2,5.4,-.6]].forEach(([x,y,z],k)=>{const g=new THREE.IcosahedronGeometry(rr(1,1.4),1);g.translate(x,y,z);parts.push(ni(jitter(g,.5,k+20)));});

function scatterTrees(count,[trunkG,folG],palette,{minCamp=11,scale=[.8,1.3],obstR=.5}={}){

    imF.setColorAt(n,col.set(palette[Math.floor(rand()*palette.length)]).multiplyScalar(rr(.85,1.1)));

function steer(ag,tx,tz,maxSpd,dt,turn=3.2){
  const dx=tx-ag.pos.x,dz=tz-ag.pos.z,dist=Math.hypot(dx,dz);
  if(dist<.3){ag.speed=Math.max(0,ag.speed-5*dt);return true;}
  let vx=dx/dist,vz=dz/dist;
  for(const o of obstacles){const ox=ag.pos.x-o.x,oz=ag.pos.z-o.z;if(Math.abs(ox)>4||Math.abs(oz)>4)continue;const d=Math.hypot(ox,oz),R=o.r+ag.radius+.55;
    if(d<R&&d>.001){const w=(R-d)/R*1.7;vx+=ox/d*w;vz+=oz/d*w;}}
  const ahead=streamInfo(ag.pos.x+vx*1.5,ag.pos.z+vz*1.5);
  if(ahead.d<6.3){const p=streamPts[ahead.i],ox=ag.pos.x-p.x,oz=ag.pos.z-p.y,d=Math.hypot(ox,oz)||1;vx+=ox/d*1.6;vz+=oz/d*1.6;}
  const vl=Math.hypot(vx,vz)||1;vx/=vl;vz/=vl;
  const diff=wrap(Math.atan2(vx,vz)-ag.yaw),mt=turn*dt;ag.yaw=wrap(ag.yaw+Math.max(-mt,Math.min(mt,diff)));
  const align=Math.max(0,Math.cos(diff)),arrive=Math.min(1,dist/1.3);
  const tgt=maxSpd*align*Math.max(.35,arrive);ag.speed+=(tgt-ag.speed)*Math.min(1,dt*3);
  ag.pos.x+=Math.sin(ag.yaw)*ag.speed*dt;ag.pos.z+=Math.cos(ag.yaw)*ag.speed*dt;
  ag.pos.y=heightAt(ag.pos.x,ag.pos.z);
  return false;
}
function faceTo(ag,x,z,dt,rate=3){const d=wrap(Math.atan2(x-ag.pos.x,z-ag.pos.z)-ag.yaw);ag.yaw=wrap(ag.yaw+Math.max(-rate*dt,Math.min(rate*dt,d)));}

function decide(){

  }

function updateBrain(dt,t){

  fireLight.intensity=(14+fuel*22)*(1+.12*Math.sin(t*13)+.08*Math.sin(t*23.7));
  for(let i=0;i<SPARKS;i++){const v=sparkVel[i];sparkPos[i*3]+=v.x*dt;sparkPos[i*3+1]+=v.y*dt*(.6+fuel);sparkPos[i*3+2]+=v.z*dt;
    v.x+=Math.sin(t*3+i)*dt*.3;if(sparkPos[i*3+1]>2.2+fuel*1.5)resetSpark(i);}
  sparkGeo.attributes.position.needsUpdate=true;
  smoke.forEach(s=>{const u=s.userData;u.t=(u.t+dt*.09)%1;s.position.set(Math.sin(u.t*9+u.t)*.3+u.t*1.2,1+u.t*7,u.t*.8);
    s.scale.setScalar(.6+u.t*3.5);s.material.opacity=Math.sin(u.t*Math.PI)*.22*(.4+fuel);});
  sticks.forEach(s=>{if(s.userData.fallFrom>0&&s.userData.state==='ground'){const gy=heightAt(s.position.x,s.position.z)+.05;
    s.position.y=Math.max(gy,s.position.y-dt*9);s.rotation.z+=dt*4;if(s.position.y<=gy){s.userData.fallFrom=0;s.rotation.z=0;}}});
  stickTimer-=dt; if(stickTimer<=0){stickTimer=rr(14,26);if(sticks.filter(s=>s.userData.state==='ground').length<6){
    const p=randomStickSpot(6,26);if(p){spawnStick(p[0],p[1],true);diary('Cae una rama de un árbol.');}}}
  water.material.normalMap.offset.y-=dt*.22; water.material.normalMap.offset.x=Math.sin(t*.2)*.05;
  windU.value=t; skyUniforms.uTime.value=t;
  // tiempo de juego
  gameMin+=dt*(1440/CONFIG.dayLengthSec); if(gameMin>=1440){gameMin-=1440;day++;}
}

// ===== 10. CÁMARA ===========================================================
const cam={yaw:0,pitch:.3,dist:10.5,tDist:10.5,target:new THREE.Vector3()};
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  if(drag.moved){cam.yaw-=dx*.005;cam.pitch=Math.max(.08,Math.min(1.1,cam.pitch+dy*.003));drag.x=e.clientX;drag.y=e.clientY;}});
addEventListener('pointerup',e=>{if(drag&&!drag.moved)onClick(e);drag=null;});
renderer.domElement.addEventListener('wheel',e=>{cam.tDist=Math.max(4.5,Math.min(26,cam.tDist*(1+Math.sign(e.deltaY)*.1)));},{passive:true});
function updateCamera(dt){
  const k=1-Math.exp(-dt*3.5);
  cam.target.lerp(new THREE.Vector3(A.pos.x+Math.sin(A.yaw)*.6,A.pos.y+1.25,A.pos.z+Math.cos(A.yaw)*.6),k);
  cam.dist=lerpA(cam.dist,cam.tDist*(soloCam>0?.6:1),1-Math.exp(-dt*2));
  const cp=Math.cos(cam.pitch);
  const p=new THREE.Vector3(cam.target.x+Math.sin(cam.yaw)*cp*cam.dist,cam.target.y+Math.sin(cam.pitch)*cam.dist,cam.target.z+Math.cos(cam.yaw)*cp*cam.dist);
  const g=heightAt(p.x,p.z)+.8; if(p.y<g)p.y=g;
  camera.position.lerp(p,1-Math.exp(-dt*8)); camera.lookAt(cam.target);
  sky.position.copy(camera.position);
  sun.position.copy(A.pos).addScaledVector(CONFIG.sunDir,140); sun.target.position.copy(A.pos);
}

// ===== INTERACCIÓN (susurros) ===============================================
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), marker=document.getElementById('marker');
function onClick(e){
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hitS=ray.intersectObjects(sticks.filter(s=>s.userData.state==='ground'),false)[0];
  showMarker(e.clientX,e.clientY);
  const releaseTarget=()=>{const tg=brain.target;if(tg&&tg.userData.state==='claimed')tg.userData.state='ground';brain.target=null;A.crouch=0;};
  if(fe<5){think('No te escucha… (Fe insuficiente)');return;}
  if(hitS){if(A.carrying){think('Ya lleva algo en las manos.');return;}
    releaseTarget();fe-=5;brain.whisper={stick:hitS.object};go('IDLE',{dur:0});diary('Le susurrás: "esa rama".');return;}
  const hitT=ray.intersectObject(terrain,false)[0];
  if(hitT){const {x,z}=hitT.point;if(!isWalkable(x,z)){think('Ahí no puede ir.');return;}
    if(A.carrying){think('Primero termina lo que está haciendo.');return;}
    releaseTarget();fe-=5;brain.whisper={point:[x,z]};go('IDLE',{dur:0});diary('Le susurrás un lugar para explorar.');}
}
function showMarker(x,y){marker.style.left=x+'px';marker.style.top=y+'px';marker.style.opacity=1;marker.style.transform='scale(1.6)';
  setTimeout(()=>{marker.style.opacity=0;marker.style.transform='scale(1)';},500);}

// ===== 11. UI ===============================================================
const $=id=>document.getElementById(id);
const ctxText=$('ctxText'), thoughtEl=$('thought'), dList=$('dList');
let thoughtTimer=0;
function think(t){thoughtEl.textContent=t;thoughtEl.style.opacity=1;thoughtTimer=2.8;}
const hhmm=()=>{const m=Math.floor(gameMin);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
function diary(t){const li=document.createElement('li');li.innerHTML=`<b>${hhmm()}</b>${t}`;dList.prepend(li);while(dList.children.length>40)dList.lastChild.remove();}
let soloCam=0;
function loHizoSolo(){const el=$('solo');el.style.opacity=1;soloCam=5;A.celebrate=1;bloom.strength=1.1;
  diary('<i>Lo hizo solo.</i> Nadie se lo pidió.');setTimeout(()=>el.style.opacity=0,3800);}
$('bDiary').onclick=()=>$('diary').classList.toggle('hidden');
addEventListener('keydown',e=>{
  if(e.key==='j'||e.key==='J')$('diary').classList.toggle('hidden');
  if(e.key==='r'||e.key==='R')cam.yaw=A.yaw+Math.PI;
  if(e.key==='F3'){e.preventDefault();CONFIG.debug=!CONFIG.debug;$('debug').classList.toggle('hidden',!CONFIG.debug);}
});
function updateUI(dt){
  if(thoughtTimer>0){thoughtTimer-=dt;if(thoughtTimer<=0)thoughtEl.style.opacity=0;}
  $('pDay').textContent=`☀ Día ${day} · ${hhmm()}`; $('pFe').textContent=`◈ Fe ${Math.round(fe)}/100`;
  $('pHogar').textContent=`⌂ Hogar ${Math.min(5,1+Math.floor(totalDelivered/3))}/5`;
  if(soloCam>0){soloCam-=dt;bloom.strength=lerpA(bloom.strength,.5,dt*.5);}
}

// ===== POSTPROCESO / LOOP ===================================================
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.6,.9); composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

diary('Despierta junto al fuego. No sabe dónde está.');
think('Observa el entorno…');
const clock=new THREE.Clock(); let fpsAcc=0,fpsN=0,fps=0,frames=0;
function loop(){
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime; renderer.info.reset();
  updateBrain(dt,t); animateHero(dt,t); updateFox(dt,t); updateWorld(dt,t); updateTweens(dt); updateCamera(dt); updateUI(dt);
  composer.render();
  fpsAcc+=dt;fpsN++;if(fpsAcc>.5){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;}
  if(CONFIG.debug)$('debug').textContent=`estado  ${brain.state}${brain.autonomous?'':' (susurro)'}\nfuego   ${fuel.toFixed(2)}\nramas   ${sticks.filter(s=>s.userData.state==='ground').length} en suelo · ${totalDelivered} entregadas\npos     ${A.pos.x.toFixed(1)}, ${A.pos.z.toFixed(1)}  suelo ${heightAt(A.pos.x,A.pos.z).toFixed(2)}\nfps     ${fps.toFixed(0)}  draw ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles/1000).toFixed(0)}k`;
  if(++frames===8){const l=$('loading');l.style.opacity=0;setTimeout(()=>l.remove(),1700);}
  requestAnimationFrame(loop);
}
cam.yaw=0; updateCamera(1); loop();
</script>
</body>
